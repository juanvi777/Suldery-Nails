<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-label="Muñequita Suldery Nails saludando y guiñando un ojo">
  <defs>
    <linearGradient id="snHair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26101d"/><stop offset=".5" stop-color="#59303c"/><stop offset=".72" stop-color="#170b13"/><stop offset="1" stop-color="#7c4852"/></linearGradient>
    <linearGradient id="snSkin" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#ffd9c2"/><stop offset=".7" stop-color="#e9a98d"/><stop offset="1" stop-color="#d58d78"/></linearGradient>
    <linearGradient id="snBow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8eae"/><stop offset=".52" stop-color="#f44981"/><stop offset="1" stop-color="#b91d58"/></linearGradient>
    <linearGradient id="snApron" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#361620"/><stop offset=".55" stop-color="#1e1018"/><stop offset="1" stop-color="#522333"/></linearGradient>
    <radialGradient id="snBlush"><stop stop-color="#f37f91" stop-opacity=".7"/><stop offset="1" stop-color="#f37f91" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="184" cy="420" rx="104" ry="13" fill="#3b1524" opacity=".17"/>
